<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/index.css" />
    <link rel="stylesheet" href="../css/article.css" />
    <link rel="stylesheet" href="../css/404.css" />
    <title>404 | The Slumber Times</title>
  </head>
  <body>
    <header class="header">
      <button class="header__theme" id="theme-toggle-button">
        <span class="theme__text theme__text--light">lights on</span>
        <span class="theme__text theme__text--dark">lights off</span>

        <span class="theme__frame">
          <img class="theme__logo theme__logo--light" src="../../static/images/light-mode-icon.svg" alt="theme-light" />
          <img class="theme__logo theme__logo--dark" src="../../static/images/dark-mode-icon.svg" alt="theme-dark" />
        </span>
      </button>

      <div class="header__logo">
        <img class="logo__avatar" src="../../static/images/avatar.png" alt="Avatar" />
        <img class="logo__decoration" src="../../static/images/decoration.svg" alt="decoration" />
      </div>
      <a class="header__title" href="index.html">The Slumber <span class="title__t">T</span>imes</a>
      <div class="header__subtitle">
        Trouble sleeping? Read poetry written by
        <a class="header__author" href="about.html">Brendan Le</a>.
      </div>
    </header>

    <main class="main">
      <article class="content">
        <h1 class="title">Error 404 Haiku</h1>

        <p class="poem__stanza">
          <span class="poem__line">Page does not exist</span>
          <span class="poem__line">I'm sorry, but do not fret.</span>
          <span class="poem__line"
            >Click <span class="history__button" onclick="window.history.back()">here</span> to go back.</span
          >
        </p>
      </article>
    </main>

    <footer class="footer">
      <div>© 2025 The Slumber Times</div>
      <div class="footer__socials">
        <a class="footer__link" href="https://work.brendanle.me">work.brendanle.me</a>
        <a class="footer__link" href="https://substack.com/@the-slumber-times/posts">substack.com</a>
      </div>
    </footer>

    <img class="texture texture--light" src="../../static/images/light-mode-texture.png" alt="texture-light" />
    <img class="texture texture--dark" src="../../static/images/dark-mode-texture.png" alt="texture-dark" />

    <script type="module" src="../js/global.js"></script>
    <script type="module" src="../js/index.js"></script>
  </body>
</html>
